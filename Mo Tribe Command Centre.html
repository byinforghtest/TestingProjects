<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mo Tribe Command Centre</title>
<style>
:root{--bg:#F2F6F6;--card:#fff;--ink:#0B2F3A;--mute:#586E74;--line:#DCE6E8;--acc:#114B5B;--blue:#4FA3B8;--amber:#E0A030;--amberink:#8A5B00;--amberbg:#FBF0D6;--tint:#EAF3F5;--good:#1D7A4D;--goodbg:#DDF1E6;--bad:#B5412E;--badbg:#F8E1DC;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1F26;--card:#10303A;--ink:#EAF3F5;--mute:#9DB4BA;--line:#1E4452;--acc:#4FA3B8;--blue:#2F7C90;--amber:#E8B04A;--amberink:#F2CE86;--amberbg:#3A3017;--tint:#16404D;--good:#6FD0A0;--goodbg:#143B2C;--bad:#F09A88;--badbg:#472620;--onacc:#0A1F26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1F26;--card:#10303A;--ink:#EAF3F5;--mute:#9DB4BA;--line:#1E4452;--acc:#4FA3B8;--blue:#2F7C90;--amber:#E8B04A;--amberink:#F2CE86;--amberbg:#3A3017;--tint:#16404D;--good:#6FD0A0;--goodbg:#143B2C;--bad:#F09A88;--badbg:#472620;--onacc:#0A1F26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0;line-height:1.2}
.band{height:9px;background:repeating-linear-gradient(90deg,var(--acc) 0 20px,var(--blue) 20px 28px,var(--amber) 28px 32px,var(--acc) 32px 52px,var(--tint) 52px 56px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{display:flex;align-items:center;gap:12px;padding:16px 0 8px;flex-wrap:wrap}
header img{width:44px;height:44px;border-radius:12px;background:#fff;padding:3px}
header h1{font-size:23px}header p{margin:0;color:var(--mute);font-size:13.5px}
.hr{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo{background:var(--amberbg);color:var(--amberink);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{font:inherit;font-weight:600;color:var(--mute);background:none;border:0;padding:9px 15px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--acc);color:var(--onacc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
.k{font:inherit;color:inherit;text-align:left;background:none;border:0;border-left:1px solid var(--line);padding:15px 17px;cursor:pointer}.k:first-child{border-left:0}.k:hover{background:var(--tint)}
.k b{display:block;font:700 25px/1.15 Cambria,Georgia,serif}.k span{color:var(--mute);font-size:13px}.k small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;margin-bottom:18px}.grid .panel{margin-bottom:0}
.panel h2{font-size:18px;margin-bottom:4px}.sub{color:var(--mute);font-size:13.5px;margin:0 0 14px}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}.scroll{overflow-x:auto}
tr.row{cursor:pointer}tr.row:hover td{background:var(--tint)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.g{background:var(--goodbg);color:var(--good)}.a{background:var(--amberbg);color:var(--amberink)}.b{background:var(--badbg);color:var(--bad)}.t{background:var(--tint);color:var(--acc)}
.btn{font:inherit;font-weight:600;font-size:13.5px;background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.alt{background:var(--tint);color:var(--acc)}.btn.bad{background:var(--badbg);color:var(--bad)}.btn.sm{padding:4px 10px;font-size:12.5px}
.lk{font:inherit;font-weight:600;color:var(--acc);background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
:root[data-theme="dark"] .lk,:root:not([data-theme="light"]) .lk{color:var(--acc)}
.bar{height:10px;background:var(--tint);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}.bar i.w{background:var(--amber)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 84px;gap:10px;align-items:center;width:100%;font:inherit;color:inherit;background:none;border:0;padding:5px 4px;cursor:pointer;text-align:left;border-radius:8px}.hb:hover{background:var(--tint)}
.hb i{height:14px;background:var(--tint);border-radius:5px;overflow:hidden;display:block}.hb u{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--acc) 0 12px,var(--blue) 12px 15px);border-radius:5px}.hb b{text-align:right;font-size:13.5px}.hb span{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{cursor:pointer}.vb rect{fill:var(--acc)}.vb.hi rect{fill:var(--amber)}.vb.f rect{fill:var(--blue);opacity:.55}.vb:hover rect{opacity:.8}.vb text{fill:var(--mute);font-size:10.5px}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}.list em{font-style:normal;color:var(--mute);font-size:13.5px;display:block}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.hl .k{border:1px solid var(--line);border-radius:10px}
.msg{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:14px;margin:6px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.tools input,.tools select{width:auto;min-width:150px}
#modal{position:fixed;inset:0;background:rgba(5,20,25,.55);overflow:auto;z-index:10;padding:calc(4vh + env(safe-area-inset-top,0px)) 12px calc(4vh + env(safe-area-inset-bottom,0px))}
#modal[hidden]{display:none}
.mb{position:relative;background:var(--card);border-radius:14px;max-width:720px;margin:0 auto;padding:22px 24px}.mb.wide{max-width:1000px}
.mb h2{font-size:21px;margin-bottom:10px;padding-right:36px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:99px;border:0;background:var(--tint);color:var(--ink);cursor:pointer;font-size:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:13px;color:var(--mute);font-weight:600;display:block}.form label input,.form label select,.form label textarea{margin-top:4px;font-weight:400}
.form label:has(textarea){grid-column:1/-1}.fa{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;margin-bottom:12px}
.bub{padding:11px 14px;border-radius:12px;max-width:92%;font-size:14.5px}.bub.u{align-self:flex-end;background:var(--acc);color:var(--onacc)}.bub.a{background:var(--tint)}.bub ul{margin:6px 0;padding-left:20px}
.q{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.big{font:700 34px/1 Cambria,Georgia,serif;color:var(--acc)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.ck input{width:auto;margin-top:4px}
.sl{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;margin:8px 0}.sl input[type=range]{padding:0}
@media (max-width:560px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hb{grid-template-columns:90px 1fr 70px}}
</style></head><body>

function edit(kind,id,isNew,pre){const sc=SCH[kind],arr=S[sc.arr],rec=isNew?null:arr.find(x=>String(x[sc.key])==id);if(!isNew&&!rec)return;const v=isNew?sc.def(pre):{...rec};
form({t:(isNew?'Add ':'Edit ')+sc.t,f:sc.f(isNew),v,del:isNew?null:()=>{arr.splice(arr.indexOf(rec),1)},ok:r=>{
if('lv'in r)r.lv=r.lv===''?null:+r.lv;
if(kind=='stock'&&rec&&r.n!=rec.n)S.orders.forEach(o=>{if(o.i==rec.n)o.i=r.n});
if(kind=='social'&&(r.followers||r.reach))r.upd=T;
if(kind=='order'&&isNew){const s=S.stock.find(x=>x.n==r.i);if(!r.p&&s)r.p=s.price;if(r.dec=='y'&&s){s.q=Math.max(0,s.q-r.q);S.log.push({d:r.d,i:r.i,q:-r.q,why:'Sold'})}delete r.dec}
if(isNew)arr.push({...v,...r});else Object.assign(rec,r)}})}
function mv(name,dir){const s=S.stock.find(x=>x.n==name);if(!s)return;form({t:(dir<0?'Take out: ':'Add stock: ')+name,f:[['q','Quantity','number'],['why','Reason','sel',dir<0?['Sold outside the shop','Damaged','Gift or sample','Returned to weaver','Other']:['New from weavers','Returned by customer','Count correction']]],v:{q:1},ok:r=>{const q=Math.abs(r.q)*dir;s.q=Math.max(0,s.q+q);S.log.push({d:T,i:name,q,why:r.why})}})}
const SYS=()=>`You are the business advisor inside Mo Tribe\u2019s Command Centre. Mo Tribe sells Northern Ghana fugu fabric, bags, clutches, fugu wear and gemstone jewellery, selling to Ghana through WhatsApp and overseas through the website, with Instagram, Facebook, TikTok and Threads as handle @motribeshop. The system has five customer levels (Customer, Client, Affiliate, Ambassador, Partner), Tribe Points, 10% referral credit, boost tracking, seasonal drops (Fugu Wednesday, Black Friday 27 Nov 2026, Detty December) and is built by BYINFORGH alongside TecXFRA. Use only the data below. The data may be sample data, so say when a conclusion depends on it. Give concrete, prioritised actions with cedi impact where the data supports it. Cover predictions, risks, growth, scaling and investor readiness when asked. Never invent social follower numbers; ask for them if not entered. Keep answers short: a one-line answer, then up to 6 bullets. Use plain language. Currency is Ghana cedis (\u20B5).`;
function ctx(){const bu=buyers(),f=fc(),bs=boostStats(),obj=m=>Object.fromEntries(Object.entries(m).map(([k,v])=>[k,[v.n,Math.round(v.v)]])),ec={};S.expenses.forEach(e=>{if(e.d>='2026-09-01')ec[e.cat]=(ec[e.cat]||0)+e.amt});
return JSON.stringify({today:T,months:months().map(m=>({m,orders:A.month[m].n,income:Math.round(mrev(m)),expenses:Math.round(mexp(m))})),forecast:{novemberPace:Math.round(f.nov),next:f.out.map(o=>[o[0],Math.round(o[1])])},targets:S.goals,sources:obj(A.src),types:obj(A.type),orderTypes:obj(A.kind),lanes:obj(A.lane),weekdays:Object.fromEntries(Object.entries(A.dow).map(([k,v])=>[DOW[k],Math.round(v.v)])),levels:LV.map((l,i)=>[l,S.customers.filter(c=>lvl(c)==i).length]),topCustomers:[...bu].sort((a,b)=>A.cs[b.id].spend-A.cs[a.id].spend).slice(0,10).map(c=>[c.name,lvName(lvl(c)),A.cs[c.id].o.length,Math.round(A.cs[c.id].spend),A.cs[c.id].last,A.cs[c.id].refs]),quietRepeatCustomers:bu.filter(c=>A.cs[c.id].o.length>=2&&A.cs[c.id].last<addD(T,-45)).length,buyers:bu.length,stock:S.stock.map(s=>[s.n,s.q,s.min,'lead '+s.lead+'d','sold30d '+Math.round(vel(s.n)*30)]),expensesSinceSep:ec,boosts:bs.rows.map(b=>[b.id,b.post,b.plat,b.spend,b.n,Math.round(b.rv)]),socials:S.socials.map(s=>[s.n,s.handle,s.followers||'not entered',s.status]),investorMetrics:MET().map(m=>[m[0],m[1]]),readinessManual:S.chk,last25Orders:S.orders.slice(-25).map(o=>[o.d,(S.customers.find(c=>c.id==o.c)||{}).name,o.i,o.q,o.q*o.p,o.src,o.l,o.s])})}
const md=t=>{let o='',ul=false;esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n').forEach(l=>{const m=l.match(/^\s*[-*]\s+(.*)/);if(m){if(!ul){o+='<ul>';ul=true}o+='<li>'+m[1]+'</li>'}else{if(ul){o+='</ul>';ul=false}if(l.trim())o+='<p style="margin:6px 0">'+l.replace(/^#{1,4}\s+(.*)/,'<b>$1</b>')+'</p>'}});return o+(ul?'</ul>':'')};
function renderChat(){const c=$('#chat');if(!c)return;c.innerHTML=chat.map(m=>`<div class="bub ${m.role=='user'?'u':'a'}">${m.role=='user'?esc(m.content):(m.content?md(m.content):'Reading the business...')}</div>`).join('')||'<p class="sub">Pick a question above or type your own.</p>';c.scrollTop=c.scrollHeight}
async function ask(q){if(busy||!smp||!q.trim())return;if(cur!='ai'){cur='ai';closeM();render()}chat.push({role:'user',content:q},{role:'assistant',content:''});busy=true;renderChat();const msgs=[{role:'user',content:SYS()+'\n\nBUSINESS DATA (JSON):\n'+ctx()+'\n\nAnswer the conversation that follows.'},{role:'assistant',content:'Understood. I will use only this data.'},...chat.slice(0,-1)];
try{const r=await smp(msgs,{cache:false,modelTier:'default',onText:({text})=>{chat[chat.length-1].content=text;renderChat()}});chat[chat.length-1].content=r.text||chat[chat.length-1].content}catch(e){chat[chat.length-1].content=e&&e.text||'The assistant could not answer ('+((e&&e.code)||'error')+'). Please try again in a moment.'}busy=false;renderChat()}
const csvOut=(h,r)=>[h,...r].map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');

if(k=='close')closeM();
else if(k=='del'){if(!cdel){cdel=true;const b=$('[data-a="del"]');if(b)b.textContent='Tap again to delete';return}FORM.del();closeM();refresh()}
else if(k=='new'){const[kind,pre]=a.slice(4).split(':');edit(kind,'',true,pre)}

else if(k=='tecx')window.open('https://www.tecxfra.com/','tecxfra','noopener,width='+Math.round(screen.availWidth/2)+',height='+screen.availHeight+',left='+Math.round(screen.availWidth/2)+',top=0');
else if(k=='export')modal(`<h2>Export</h2>${dl?`<p class="sub">Download your data, including every edit you have made.</p><div class="tools"><button class="btn" data-a="dl:json">Everything (JSON backup)</button><button class="btn alt" data-a="dl:orders">Orders (CSV)</button><button class="btn alt" data-a="dl:cust">Customers (CSV)</button><button class="btn alt" data-a="dl:exp">Expenses (CSV)</button></div>`:'<p class="sub">Downloads are available when this page is opened in the Claude app or on claude.ai.</p>'}`);
else if(k=='dl'){const cu=id=>(S.customers.find(c=>c.id==id)||{}).name;if(v=='json')dlf('motribe-command-centre.json',JSON.stringify(S,null,1));if(v=='orders')dlf('motribe-orders.csv',csvOut(['date','customer','item','qty','unit_price','total','status','source','type','lane','boost'],S.orders.map(o=>[o.d,cu(o.c),o.i,o.q,o.p,o.q*o.p,o.s,o.src,o.k,o.l,o.b])));if(v=='cust')dlf('motribe-customers.csv',csvOut(['name','city','lane','level','orders','spend','last_order','referrals'],S.customers.map(c=>[c.name,c.city,c.lane,lvName(lvl(c)),A.cs[c.id].o.length,A.cs[c.id].spend,A.cs[c.id].last,A.cs[c.id].refs])));if(v=='exp')dlf('motribe-expenses.csv',csvOut(['date','category','amount','note'],S.expenses.map(e=>[e.d,e.cat,e.amt,e.note])))}
else if(k=='reset')modal('<h2>Reset to the sample data?</h2><p>Every edit, new customer, order and expense you have added will be lost.</p><div class="tools"><button class="btn bad" data-a="reset2">Reset</button><button class="btn alt" data-a="close">Keep my data</button></div>');
else if(k=='reset2'){try{localStorage.removeItem(KEY)}catch(e){}load();A=calc();closeM();chat=[];render()}
else if(k=='csv'){const L=$('#csv').value.trim().split('\n').map(l=>l.split(',').map(x=>x.trim())),h=(L.shift()||[]).map(x=>x.toLowerCase());let n=0;L.forEach(r=>{const g=c=>r[h.indexOf(c)],s=S.socials.find(x=>x.n.toLowerCase()==String(g('platform')||'').toLowerCase());if(!s)return;s.followers=+g('followers')||0;s.reach=+g('reach')||0;s.eng=+g('engagement')||0;s.posts=+g('posts')||0;s.status='Metricool connected';s.upd=T;S.snaps.push({d:T,n:s.n,followers:s.followers,reach:s.reach,eng:s.eng,posts:s.posts});n++});refresh();modal(`<h2>Import done</h2><p>${n} platforms updated. Check the cards on this page.</p>`)}}
